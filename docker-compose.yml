version: '3.8'

services:
  app:
    build: .
    ports:
      - "8443:8443"
      - "9000:9000"
    volumes:
      - ./server.key:/usr/src/app/server.key
      - ./server.crt:/usr/src/app/server.crt
      - ./config.json:/usr/src/app/config.json
    environment:
      PORT: "8443"
      API_PORT: "9000"
      TLS_KEY_PATH: "/usr/src/app/server.key"
      TLS_CERT_PATH: "/usr/src/app/server.crt"
      REDIS_URL: "redis://redis:6379"
      MONGO_URI: "mongodb://user:password@mongo:27017/admin"
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: "redis:7-alpine"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  mongo-data:
